# ═══════════════════════════════════════════════════════════════
# TrendRadar 时间线配置
# 北京时间：09:00 增量早报，21:00 当日汇总
# config/config.yaml 中应设置：
# schedule:
#   enabled: true
#   preset: "custom"
# ═══════════════════════════════════════════════════════════════

presets: {}

custom:
  name: "AI 早晚报"
  description: "每天北京时间 09:00 推送增量早报，21:00 推送当日汇总。"

  # 不在早晚时间窗口时，仅采集，不调用 AI、不推送。
  # 这样手动误触发或 GitHub 延迟时不会反复消耗 Token。
  default:
    collect: true
    analyze: false
    ai_mode: "follow_report"
    push: false
    report_mode: "incremental"
    once:
      analyze: true
      push: true

  periods:
    morning_report:
      name: "AI 增量早报"
      # 给 GitHub Actions 的触发延迟留出缓冲
      start: "08:00"
      end: "11:00"
      collect: true
      analyze: true
      ai_mode: "incremental"
      push: true
      report_mode: "incremental"
      filter_method: "ai"
      once:
        analyze: true
        push: true

    evening_summary:
      name: "AI 当日汇总"
      # 给 GitHub Actions 的触发延迟留出缓冲
      start: "20:00"
      end: "23:59"
      collect: true
      analyze: true
      ai_mode: "daily"
      push: true
      report_mode: "daily"
      filter_method: "ai"
      once:
        analyze: true
        push: true

  day_plans:
    all_day:
      periods:
        - "morning_report"
        - "evening_summary"

  week_map:
    1: "all_day"
    2: "all_day"
    3: "all_day"
    4: "all_day"
    5: "all_day"
    6: "all_day"
    7: "all_day"
