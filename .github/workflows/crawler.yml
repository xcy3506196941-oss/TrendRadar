name: Get Hot News

on:
  schedule:
    # GitHub Actions cron 使用 UTC：
    # 01:00 UTC = 北京时间 09:00
    # 13:00 UTC = 北京时间 21:00
    - cron: "0 1,13 * * *"

  workflow_dispatch:
    inputs:
      force_ai_test:
        description: "立即测试一次 AI 筛选、翻译和分析（会消耗少量 Token）"
        required: false
        default: false
        type: boolean

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Check Expiration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_FILE="crawler.yml"
          API_URL="repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs"

          TOTAL=$(gh api "$API_URL" --jq '.total_count')
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "No previous runs found, skipping expiration check"
            exit 0
          fi

          LAST_PAGE=$(( (TOTAL + 99) / 100 ))
          FIRST_RUN_DATE=$(gh api "$API_URL?per_page=100&page=$LAST_PAGE" --jq '.workflow_runs[-1].created_at')

          if [ -n "$FIRST_RUN_DATE" ]; then
            CURRENT_TIMESTAMP=$(date +%s)
            FIRST_RUN_TIMESTAMP=$(date -d "$FIRST_RUN_DATE" +%s)
            DIFF_SECONDS=$((CURRENT_TIMESTAMP - FIRST_RUN_TIMESTAMP))
            LIMIT_SECONDS=604800

            if [ "$DIFF_SECONDS" -gt "$LIMIT_SECONDS" ]; then
              echo "⚠️ 试用期已结束，请运行 Check In 签到续期"
              gh workflow disable "$WORKFLOW_FILE"
              exit 1
            else
              DAYS_LEFT=$(( (LIMIT_SECONDS - DIFF_SECONDS) / 86400 ))
              echo "✅ 试用期剩余 ${DAYS_LEFT} 天"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Verify required files
        run: |
          test -f config/config.yaml || { echo "❌ 缺少 config/config.yaml"; exit 1; }
          test -f config/timeline.yaml || { echo "❌ 缺少 config/timeline.yaml"; exit 1; }

      - name: Run crawler
        env:
          # 通知渠道
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}

          # 邮件
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}

          # 其他通知
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}

          # 手动测试时临时关闭时间线限制，让本次立即执行 AI 和报告生成
          SCHEDULE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.force_ai_test && 'false' || '' }}

          # 百炼 AI
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}

          # Cloudflare R2 / S3 兼容存储
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}

          GITHUB_ACTIONS: "true"

        run: uv run python -m trendradar

      - name: Check Cloudflare config
        if: success()
        id: cf_check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && \
             [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && \
             [ -n "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 Cloudflare Pages 配置"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 未完整配置 Cloudflare Pages Secrets，跳过部署"
          fi

      - name: Prepare Cloudflare Pages assets
        if: success() && steps.cf_check.outputs.enabled == 'true'
        id: prepare_cf
        run: |
          rm -rf cloudflare_dist
          mkdir -p cloudflare_dist

          # 优先部署 TrendRadar 生成的网站首页及 HTML 报告目录
          if [ -f "output/index.html" ]; then
            echo "✅ 找到网站首页：output/index.html"
            cp "output/index.html" "cloudflare_dist/index.html"

            if [ -d "output/html" ]; then
              cp -R "output/html" "cloudflare_dist/html"
            fi

            echo "has_report=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 没有 output/index.html 时，尝试将最新报告作为网站首页
          REPORT_FILE=""

          for candidate in \
            "output/html/latest/current.html" \
            "output/html/latest/incremental.html" \
            "output/html/latest/daily.html"; do
            if [ -f "$candidate" ]; then
              REPORT_FILE="$candidate"
              break
            fi
          done

          # 兼容其他目录结构：查找 output 下最新生成的 HTML
          if [ -z "$REPORT_FILE" ]; then
            REPORT_FILE=$(find output -type f -name "*.html" -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-)
          fi

          if [ -z "$REPORT_FILE" ] || [ ! -f "$REPORT_FILE" ]; then
            echo "ℹ️ 本次没有生成 HTML 报告，跳过 Cloudflare Pages 部署"
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            find output -maxdepth 5 -type f | sort || true
            exit 0
          fi

          echo "✅ 找到报告文件：$REPORT_FILE"
          cp "$REPORT_FILE" "cloudflare_dist/index.html"
          echo "has_report=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: success() && steps.cf_check.outputs.enabled == 'true' && steps.prepare_cf.outputs.has_report == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare_dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main
